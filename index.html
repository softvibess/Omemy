<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Random Video Chat</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{background:#020617;padding:12px;text-align:center;font-size:20px;font-weight:bold}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
video{width:100%;height:100%;background:#000;border-radius:12px;object-fit:cover}
.controls{display:flex;gap:10px;padding:10px;background:#020617}
button{flex:1;padding:12px;border:none;border-radius:10px;font-size:16px;cursor:pointer}
#start{background:#16a34a;color:white}
#next{background:#ea580c;color:white}
#stop{background:#dc2626;color:white}
.chat{position:absolute;bottom:80px;right:20px;width:260px;background:#020617;border-radius:12px;padding:10px;display:flex;flex-direction:column;height:260px}
.chat-messages{flex:1;overflow:auto;font-size:14px;margin-bottom:8px}
.chat input{padding:8px;border-radius:8px;border:none}
</style>
</head>
<body>
<header>دردشة فيديو عشوائية</header>
<main>
<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>
</main>
<div class="controls">
<button id="start">ابدأ</button>
<button id="next">التالي</button>
<button id="stop">إيقاف</button>
</div>
<div class="chat">
<div class="chat-messages" id="messages"></div>
<input id="msgBox" placeholder="اكتب رسالة..." />
</div>
<script>
let localStream,pc,ws;
const localVideo=document.getElementById('localVideo');
const remoteVideo=document.getElementById('remoteVideo');
const msgBox=document.getElementById('msgBox');
const messages=document.getElementById('messages');

async function start(){
 localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
 localVideo.srcObject=localStream;
 connectSocket();
}

document.getElementById('start').onclick=start;
document.getElementById('next').onclick=nextPeer;
document.getElementById('stop').onclick=stopAll;

function connectSocket(){
 ws=new WebSocket("wss://boggish-usually-maverick.ngrok-free.dev");
 ws.onmessage=async e=>{
  const data=JSON.parse(e.data);
  if(data.offer){await createPeer();await pc.setRemoteDescription(data.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);ws.send(JSON.stringify({answer:ans}));}
  if(data.answer){await pc.setRemoteDescription(data.answer);} 
  if(data.candidate){pc.addIceCandidate(data.candidate);} 
  if(data.msg){addMsg("غريب: "+data.msg);} 
 }
}

async function createPeer(){
 pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.ontrack=e=>remoteVideo.srcObject=e.streams[0];
 pc.onicecandidate=e=>{if(e.candidate)ws.send(JSON.stringify({candidate:e.candidate}));};
}

async function nextPeer(){
 if(pc)pc.close();
 await createPeer();
 const offer=await pc.createOffer();
 await pc.setLocalDescription(offer);
 ws.send(JSON.stringify({offer}));
}

function stopAll(){
 if(pc)pc.close();
 if(localStream)localStream.getTracks().forEach(t=>t.stop());
 remoteVideo.srcObject=null;
}

msgBox.addEventListener('keydown',e=>{
 if(e.key==='Enter'){ws.send(JSON.stringify({msg:msgBox.value}));addMsg("أنت: "+msgBox.value);msgBox.value="";}
});

function addMsg(m){messages.innerHTML+=m+"<br>";messages.scrollTop=messages.scrollHeight;}
</script>
</body>
</html>
